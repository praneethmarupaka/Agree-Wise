services:
  - type: web
    name: agreewise-api
    runtime: node
    rootDir: agreewise/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: "10000"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RATE_LIMIT_INSTALL
        sync: false
      - key: RATE_LIMIT_IP
        sync: false
      - key: RATE_LIMIT_GLOBAL
        sync: false
